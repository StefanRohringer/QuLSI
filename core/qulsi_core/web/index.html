<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuLSI">
<title>QuLSI</title>
<style>
:root{
  --bg:#000;--flaeche:#0c0c0d;--flaeche2:#141416;--flaeche3:#1c1c1f;--linie:rgba(255,255,255,.08);--linie2:rgba(255,255,255,.14);
  --text:#f5f5f7;--zweit:#a1a1a6;--leise:#6e6e73;--weiss:#fff;--gut:#4cd38a;--warn:#ffb340;--rot:#ff5f57;
  --r:18px;--r-s:12px;--seite:16px;--tab:64px;
  --oben:env(safe-area-inset-top);--unten:env(safe-area-inset-bottom);
  --schrift:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--schrift);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* ---------- Grundgerüst: Seitenleiste (Laptop) / Tab-Leiste (iPhone) */
.app{display:flex;min-height:100dvh}
nav.seite{display:none}
.inhalt{flex:1;min-width:0;padding:calc(var(--oben) + 8px) var(--seite) calc(var(--tab) + var(--unten) + 24px)}
.spalte{max-width:760px;margin:0 auto}
header.kopf{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:6px}
.marke{height:13px;width:auto;color:var(--text);display:block}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--zweit);padding:6px 10px;border-radius:99px;background:var(--flaeche2);border:1px solid var(--linie)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--leise)}
.status.online i{background:var(--gut);box-shadow:0 0 0 3px rgba(76,211,138,.15)}
.status.offline i{background:var(--warn)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding:6px 6px calc(6px + var(--unten));background:rgba(10,10,11,.78);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--linie)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 2px;font-size:10.5px;color:var(--leise);letter-spacing:.01em;transition:color .2s}
nav.tabs a.aktiv{color:var(--weiss)}
nav.tabs a .punkt{position:relative}
nav.tabs a .zahl{position:absolute;top:-4px;right:-9px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--weiss);color:#000;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}

@media (min-width:960px){
  nav.tabs{display:none}
  nav.seite{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;width:260px;flex:none;padding:28px 16px 20px;border-right:1px solid var(--linie);background:#050505}
  nav.seite .marke{height:15px;margin:0 10px}
  nav.seite .claim{margin:10px 10px 34px;font-size:8.5px;letter-spacing:.2em;color:var(--leise);text-transform:uppercase;white-space:nowrap}
  nav.seite a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--zweit);font-size:15px;margin-bottom:2px;transition:background .15s,color .15s}
  nav.seite a:hover{background:var(--flaeche2);color:var(--text)}
  nav.seite a.aktiv{background:var(--flaeche3);color:var(--weiss)}
  nav.seite a .zahl{margin-left:auto;font-size:12px;background:var(--weiss);color:#000;border-radius:9px;padding:0 7px;font-weight:600}
  nav.seite .fuss{margin-top:auto;padding:0 10px}
  header.kopf .marke{display:none}
  header.kopf{display:none}
  .inhalt{padding:28px 40px 48px}
}

/* ---------- Typografie und Karten */
h1.titel{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:10px 0 4px}
.unter{color:var(--zweit);margin:0 0 22px;font-size:15px}
h2.abschnitt{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--leise);margin:28px 4px 10px}
.karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.karte h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--zweit);display:flex;align-items:center;gap:8px}
.karte h3 .mehr{margin-left:auto;font-weight:500;color:var(--leise);font-size:12px}
.raster{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.raster{grid-template-columns:1fr 1fr}.raster .breit{grid-column:1/-1}}
.raster .karte{margin:0}
ul.liste{list-style:none;margin:0;padding:0}
ul.liste li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--linie);align-items:baseline}
ul.liste li:first-child{border-top:0;padding-top:2px}
.zeit{color:var(--leise);font-variant-numeric:tabular-nums;font-size:14px;min-width:44px}
.klein{font-size:13px;color:var(--leise)}
.leer{color:var(--leise);font-size:14px}
.warn{color:var(--warn)}.gut{color:var(--gut)}.rot{color:var(--rot)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--flaeche3);color:var(--zweit);border:1px solid var(--linie)}
.chip.warn{color:var(--warn);border-color:rgba(255,179,64,.3)}
.chip.gut{color:var(--gut);border-color:rgba(76,211,138,.3)}

/* Frage-Feld auf "Heute" */
.frage{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border-radius:var(--r);background:var(--flaeche2);border:1px solid var(--linie);color:var(--leise);font-size:16px;margin-bottom:22px;text-align:left}
.frage svg{color:var(--zweit)}

/* ---------- Gespräch */
.chat{display:flex;flex-direction:column;min-height:calc(100dvh - 210px)}
#verlauf{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.msg{max-width:84%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word;font-size:16px;animation:rein .25s ease}
.msg.ich{align-self:flex-end;background:var(--weiss);color:#000;border-bottom-right-radius:6px}
.msg.qulsi{align-self:flex-start;background:var(--flaeche2);border:1px solid var(--linie);border-bottom-left-radius:6px}
.msg .meta{font-size:11.5px;color:var(--leise);margin-top:6px;white-space:normal}
.msg details.meta summary{list-style:none;cursor:pointer;opacity:.6;display:inline}
.msg details.meta summary::-webkit-details-marker{display:none}
.msg details.meta[open] summary{margin-right:6px}
.msg details.meta[open] summary::after{content:":"}
.hinweis-zeile{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--warn);padding:6px 10px;margin-bottom:10px;border-radius:10px;background:rgba(255,179,64,.08)}
.hinweis-zeile svg{width:15px;height:15px;flex:none}
.hinweis-zeile span{flex:1}
.hinweis-zeile button{color:var(--zweit);font-size:18px;line-height:1;padding:0 4px}
.freigabe .satz{margin-top:6px;font-size:15px;line-height:1.4}
.msg.qulsi{white-space:normal}
.msg.qulsi p{margin:0 0 .6em}.msg.qulsi p:last-of-type{margin-bottom:0}
.msg.qulsi ul,.msg.qulsi ol{margin:.2em 0 .6em;padding-left:1.3em}
.msg.qulsi li{margin:.15em 0}
.msg.qulsi h4{font-size:15px;font-weight:600;margin:.8em 0 .3em}.msg.qulsi h4:first-child{margin-top:0}
.msg.qulsi code{font:13.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}
.msg.qulsi pre{margin:.4em 0 .6em;padding:10px 12px;border-radius:10px;background:#000;border:1px solid var(--linie);overflow:auto;white-space:pre}
.msg.qulsi pre code{background:none;padding:0}
.msg.qulsi a{text-decoration:underline;text-underline-offset:2px}
.msg.qulsi strong{font-weight:600;color:var(--weiss)}
.tippt span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--zweit);animation:tipp 1.2s infinite}
.tippt span:nth-child(2){animation-delay:.15s}.tippt span:nth-child(3){animation-delay:.3s}
@keyframes tipp{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@keyframes rein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vorschlaege{display:flex;flex-wrap:wrap;gap:8px;margin:auto 0 16px}
.vorschlaege button{padding:9px 14px;border-radius:99px;background:var(--flaeche2);border:1px solid var(--linie);color:var(--zweit);font-size:14px}
.leerchat{margin:auto 0 18px;text-align:center;color:var(--leise)}
.leerchat .marke{height:11px;margin:0 auto 12px;color:var(--zweit)}
form.eingabe{position:sticky;bottom:calc(var(--tab) + var(--unten) + 10px);display:flex;gap:8px;align-items:flex-end;padding:6px;border-radius:26px;background:rgba(20,20,22,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--linie2)}
@media (min-width:960px){form.eingabe{bottom:20px}.chat{min-height:calc(100dvh - 130px)}}
form.eingabe{flex-wrap:wrap}
form.eingabe .anhaenge{flex:1 1 100%;display:flex;gap:8px;overflow-x:auto;padding:4px 4px 2px}
form.eingabe .anhaenge:empty{display:none}
.anhang{position:relative;flex:none;display:flex;align-items:center;gap:8px;height:56px;max-width:220px;padding:0 30px 0 8px;border-radius:14px;background:var(--flaeche2,#1c1c1f);border:1px solid var(--linie2);font-size:13px}
.anhang img{width:42px;height:42px;object-fit:cover;border-radius:9px}
.anhang .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.anhang .balken{position:absolute;left:8px;right:8px;bottom:5px;height:3px;border-radius:2px;background:var(--linie2);overflow:hidden}
.anhang .balken i{display:block;height:100%;background:var(--weiss);transition:width .2s}
.anhang.fehler{border-color:var(--rot);color:var(--rot)}
.anhang button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:inherit;font-size:14px;line-height:22px;padding:0;cursor:pointer}
.msg .bilder{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;justify-content:flex-end}
.msg .bilder img{width:120px;height:120px;object-fit:cover;border-radius:14px}
.msg .dateichip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:rgba(0,0,0,.08);font-size:14px;margin:0 0 6px 6px}
.msg .dateichip .i{width:16px;height:16px}
.chat.ziehen form.eingabe,.ablage.ziehen{outline:2px dashed var(--weiss);outline-offset:3px}
.ablage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 16px;text-align:center;border:1px dashed var(--linie2);border-radius:var(--r);margin-bottom:12px}
.ablage .reihe{justify-content:center}
.hoch-liste .zeile img{width:44px;height:44px;object-fit:cover;border-radius:10px;flex:none}
.hoch-liste .zeile .sym{flex:none}
#anhang-menue{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#anhang-menue .innen{width:min(520px,100%);margin:0 10px calc(var(--unten,0px) + 14px);display:flex;flex-direction:column;gap:8px}
#anhang-menue button{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;border:0;background:#1c1c1f;color:inherit;font-size:17px;cursor:pointer}
form.eingabe textarea{flex:1;min-width:0;resize:none;background:none;border:0;outline:none;padding:10px 6px 10px 12px;max-height:140px;font-size:16px;line-height:1.35}
.rund{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--zweit);transition:background .15s}
.rund:hover{background:var(--flaeche3)}
.rund.senden{background:var(--weiss);color:#000}
.rund.senden:disabled{opacity:.3}
.rund.an{background:var(--rot);color:#fff;animation:puls 1.4s infinite}
@keyframes puls{0%{box-shadow:0 0 0 0 rgba(255,95,87,.5)}100%{box-shadow:0 0 0 14px rgba(255,95,87,0)}}

/* ---------- Einstellungen: gruppierte Listen */
.gruppe{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.zeile{display:flex;align-items:center;gap:14px;padding:13px 16px;min-height:52px;border-top:1px solid var(--linie);width:100%;text-align:left}
.gruppe>.zeile:first-child,.gruppe>:first-child .zeile{border-top:0}
a.zeile:hover,button.zeile:hover{background:var(--flaeche2)}
.zeile .sym{width:32px;height:32px;border-radius:9px;background:var(--flaeche3);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none}
.zeile .sym svg{width:18px;height:18px}
.zeile .txt{flex:1;min-width:0}
.zeile.spalte{flex-direction:column;align-items:stretch;gap:10px}
.zeile.spalte .txt{flex:none}
.zeile.spalte>input,.zeile.spalte>select{width:100%;max-width:none;display:block}
.zeile .txt b{display:block;font-weight:500;font-size:15.5px}
.zeile .txt small{display:block;color:var(--leise);font-size:13px;margin-top:1px}
.zeile .wert{color:var(--leise);font-size:14px;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.zeile .pfeil{color:var(--leise);width:16px;height:16px}
.zurueck{display:inline-flex;align-items:center;gap:4px;color:var(--zweit);font-size:15px;margin:6px 0 0 -4px;padding:6px 4px}
.hinweis{font-size:13px;color:var(--leise);margin:8px 6px 0;line-height:1.5}
.hinweis code,.befehl code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--zweit)}
.befehl{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;border-radius:10px;background:#000;border:1px solid var(--linie);overflow:auto}
.befehl code{white-space:nowrap;flex:1}
.geaendert{font-size:12px;color:var(--warn);cursor:pointer}

/* Bedienelemente */
.schalter{position:relative;width:51px;height:31px;flex:none}
.schalter input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.schalter span{position:absolute;inset:0;border-radius:99px;background:#39393d;transition:background .2s}
.schalter span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .22s cubic-bezier(.3,.7,.4,1)}
.schalter input:checked+span{background:var(--gut)}
.schalter input:checked+span::after{transform:translateX(20px)}
details.bereich>summary{list-style:none;cursor:pointer;border-top:0}
details.bereich>summary::-webkit-details-marker{display:none}
details.bereich>summary:hover{background:var(--flaeche2)}
details.bereich>summary .auf{width:16px;height:16px;color:var(--zweit);transition:transform .2s;flex:none}
details.bereich[open]>summary .auf{transform:rotate(90deg)}
details.bereich[open]>summary{border-bottom:1px solid var(--linie)}
details.bereich>.zeile:nth-child(2){border-top:0}
.technik{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--leise)}
input.feld[type=number]{width:84px;text-align:right}
.schritte{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14.5px;line-height:1.45;color:var(--text)}
.schritte a{color:var(--weiss);text-decoration:underline;text-underline-offset:2px}
.qr{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.qr svg{width:220px;height:220px;border-radius:12px}
.warnung-rot{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:rgba(255,95,87,.12);border:1px solid rgba(255,95,87,.45);color:#ffb3ae;font-size:14px;line-height:1.4;white-space:normal}
.warnung-rot svg{width:18px;height:18px;flex:none;color:var(--rot);margin-top:1px}
.warnung-rot span{flex:1}
.warnung-rot button{color:#ffb3ae;font-size:20px;line-height:1;padding:0 2px}
#warnungen-live{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;z-index:60;display:grid;gap:8px;max-width:640px;margin:0 auto}
.warnung-rot.schwebend{margin:0;background:#2a1110;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.chat-freigabe{border-color:rgba(255,179,64,.35);margin:6px 0 12px}
.legende{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:0 6px 12px;font-size:13px;color:var(--zweit)}
.legende b{color:var(--text);font-weight:600;margin-right:4px}
.segment{display:inline-flex;padding:2px;border-radius:10px;background:var(--flaeche3);gap:2px;flex:none}
.segment button{padding:6px 11px;border-radius:8px;font-size:13px;color:var(--zweit);white-space:nowrap}
.segment button.an{background:#3a3a3e;color:var(--weiss);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.segment button:disabled{opacity:.3;cursor:not-allowed}
select.wahl,input.feld,textarea.feld{background:var(--flaeche3);color:var(--text);border:1px solid var(--linie);border-radius:10px;padding:8px 10px;font-size:14px;outline:none;max-width:200px}
input.feld{width:110px;text-align:right}
input.feld.breit{width:100%;max-width:none;text-align:left}
select.wahl:focus,input.feld:focus{border-color:var(--linie2)}
.knopf{color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--flaeche3);border:1px solid var(--linie);font-size:14px;font-weight:500;white-space:nowrap}
.knopf:hover{background:#26262a}
.knopf.hell{background:var(--weiss);color:#000;border-color:var(--weiss)}
.knopf.klein{padding:6px 12px;font-size:13px;border-radius:10px}
.knopf:disabled{opacity:.5}
.reihe{display:flex;gap:8px;flex-wrap:wrap}
.geaendert{display:block;width:fit-content;margin:3px 0 0;font-weight:400}
.zeile .txt small.wert-mobil{display:none}
.uebersicht small.wert-mobil{color:var(--zweit)}
@media (max-width:600px){
  .zeile.stapel{flex-wrap:wrap;row-gap:10px}
  .zeile.stapel .txt{flex:1 1 calc(100% - 46px)}
  .zeile.stapel>.segment,.zeile.stapel>select.wahl{width:100%;max-width:none;display:flex}
  .zeile.stapel .sym~.segment{margin-left:46px;width:calc(100% - 46px)}
  .zeile.stapel .segment button{flex:1;padding:8px 6px}
  .uebersicht .wert{display:none}.uebersicht .zeile .txt small.wert-mobil{display:block}
}

.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);margin-bottom:12px;font-size:14px;line-height:1.45}
.banner svg{flex:none;margin-top:1px}
.banner b{display:block;font-size:15px;margin-bottom:2px}
.banner.rot{background:rgba(255,95,87,.12);border:1px solid rgba(255,95,87,.45);color:#ffb4ae}
.banner.rot b{color:var(--rot)}
.banner.gelb{background:rgba(255,179,64,.10);border:1px solid rgba(255,179,64,.4);color:#ffd59a}
.banner.gelb b{color:var(--warn)}
.freigabe{padding:14px 0;border-top:1px solid var(--linie)}
.freigabe:first-of-type{border-top:0;padding-top:4px}
.freigabe .kopfzeile{display:flex;align-items:baseline;gap:10px}
.freigabe .kopfzeile b{font-weight:600;font-size:16px;flex:1}
.vorschau{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#000;border:1px solid var(--linie);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--zweit);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
.freigabe .knoepfe{display:flex;gap:8px;margin-top:12px}
.freigabe .knoepfe .knopf{flex:1}
.knopf.rot-umriss{color:var(--rot);border-color:rgba(255,95,87,.35)}
.gespraech-kopf{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.gespraech-kopf b{font-size:22px;font-weight:700;letter-spacing:-.01em;flex:1}
/* Blatt (PIN, Bestätigung) */
#blatt{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:einblenden .2s}
#blatt .innen{width:100%;max-width:440px;background:var(--flaeche2);border:1px solid var(--linie2);border-radius:24px 24px 0 0;padding:22px 20px calc(20px + var(--unten));animation:hoch .25s cubic-bezier(.3,.7,.4,1)}
@media (min-width:600px){#blatt{align-items:center}#blatt .innen{border-radius:24px}}
#blatt h3{margin:0 0 4px;font-size:19px}
#blatt p{margin:0 0 16px;color:var(--zweit);font-size:14px}
#blatt input.pin{width:100%;text-align:center;font-size:28px;letter-spacing:.5em;padding:14px;border-radius:14px;background:#000;border:1px solid var(--linie2);outline:none;-webkit-text-security:disc}
#blatt .fehltext{min-height:20px;margin:10px 0;color:var(--rot);font-size:14px;text-align:center}
.pin-form{display:flex;flex-direction:column;gap:10px}
.pin-form h3{margin:0}
.pin-form input{width:100%;max-width:none;text-align:left;font-size:17px;padding:12px 14px;border-radius:12px;background:var(--feld,#0d0d0f);border:1px solid var(--linie2);color:inherit;outline:none}
.pin-form input.pin{letter-spacing:.3em;-webkit-text-security:disc}
.pin-form input.pin::placeholder{letter-spacing:normal}
.pin-form input.code{text-transform:uppercase;letter-spacing:.12em;font-family:ui-monospace,Menlo,monospace}
.pin-form input.code::placeholder{text-transform:none;letter-spacing:normal;font-family:inherit}
.pin-form input:focus{border-color:var(--akzent,#7aa2ff)}
.pin-form .fehltext{min-height:0;color:var(--rot);font-size:14px}
.pin-form .fehltext:empty{display:none}
.pin-form .befehl{margin:0}
.linkknopf{background:none;border:0;padding:4px 0;color:var(--zweit);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
#blatt .knoepfe{display:flex;gap:8px}
#blatt .knoepfe .knopf{flex:1;padding:13px}
@keyframes einblenden{from{opacity:0}}
@keyframes hoch{from{transform:translateY(40px);opacity:0}}
.aufnahme{display:flex;align-items:center;gap:14px;margin-top:12px}
.aufnahme .uhr{font:600 22px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;min-width:64px}
.aufnahme .rund.gross{width:56px;height:56px;background:var(--flaeche3);color:var(--text)}
.aufnahme .rund.gross.an{background:var(--rot);color:#fff}
textarea.feld{width:100%;max-width:none;text-align:left;resize:vertical;min-height:70px;font-size:15px;line-height:1.45}
/* Agents */
.agent{padding:16px 18px}
.agent .kopfzeile{display:flex;align-items:center;gap:12px}
.agent .kopfzeile .txt{flex:1;min-width:0}
.agent .kopfzeile b{font-weight:600;font-size:16px}
.agent .details{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.agent .ergebnis{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--flaeche2);font-size:14px;color:var(--zweit);white-space:pre-wrap}
.agent .aktionen{display:flex;gap:8px;margin-top:12px}

/* Gedächtnis */
.zahlen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media (min-width:700px){.zahlen{grid-template-columns:repeat(6,1fr)}}
.zahl-kachel{background:var(--flaeche);border:1px solid var(--linie);border-radius:14px;padding:12px}
.zahl-kachel b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.zahl-kachel span{font-size:11.5px;color:var(--leise)}
.suche{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--flaeche2);border:1px solid var(--linie);margin-bottom:12px}
.suche input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px}
.tagwahl{display:flex;align-items:center;gap:8px}
.tagwahl b{font-weight:500;font-size:14px;min-width:120px;text-align:center}
.treffer{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--linie)}
.treffer:first-child{border-top:0}
.treffer img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--flaeche3)}

/* Anmelden */
.willkommen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.willkommen .marke{height:22px;margin-bottom:14px}
.willkommen .claim{font-size:10px;letter-spacing:.3em;color:var(--leise);text-transform:uppercase;margin-bottom:56px}
.willkommen form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.willkommen input{padding:14px 16px;border-radius:14px;background:var(--flaeche2);border:1px solid var(--linie);outline:none;text-align:center;font-size:16px}
.willkommen p{color:var(--leise);font-size:13px;margin-top:18px;max-width:340px}

/* Meldung unten */
#meldung{position:fixed;left:50%;bottom:calc(var(--tab) + var(--unten) + 18px);transform:translate(-50%,20px);opacity:0;z-index:40;
  padding:10px 16px;border-radius:99px;background:var(--weiss);color:#000;font-size:14px;font-weight:500;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
#meldung.zeigen{opacity:1;transform:translate(-50%,0)}
#meldung.fehler{background:var(--rot);color:#fff}
@media (min-width:960px){#meldung{bottom:28px;left:calc(50% + 130px)}}
#stimme-status{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:45;display:flex;align-items:center;gap:10px;
  padding:9px 14px;border-radius:99px;border:1px solid var(--linie2);background:rgba(28,28,31,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:inherit;font-size:14px;cursor:pointer;white-space:nowrap;max-width:calc(100vw - 32px)}
#stimme-status .punkt-an{width:8px;height:8px;border-radius:50%;background:var(--gut);animation:puls 1.2s ease-in-out infinite}
#stimme-status .weg{color:var(--zweit);padding-left:10px;border-left:1px solid var(--linie2)}
@keyframes puls{50%{opacity:.3}}
.tipps{margin:10px 0 0;padding-left:18px;color:var(--zweit)}
.tipps li{margin:2px 0}
.ansicht{animation:rein .2s ease}
</style>
</head>

<script>
"use strict";
// ---------------------------------------------------------------- Grundlagen
let key = "";
try { key = localStorage.getItem("qulsi-key") || ""; } catch (e) {}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic = (n, k = "i") => `<svg class="${k}"><use href="#i-${n}"/></svg>`;
const zustand = {heute: null, freigaben: [], timeline: [], connectoren: null, agenten: null, einst: null, gedaechtnis: null,
  verlauf: [], nachrichten: [], gespraech: 0, tag: null, offline: null};

async function api(pfad, opt = {}) {
  opt.headers = Object.assign({}, opt.headers, key ? {Authorization: "Bearer " + key} : {});
  if (opt.json !== undefined) { opt.body = JSON.stringify(opt.json); opt.headers["Content-Type"] = "application/json"; opt.method = opt.method || "POST"; }
  const r = await fetch(pfad, opt);
  if (r.status === 401) { anmelden(true); throw Object.assign(new Error("Schlüssel fehlt"), {status: 401}); }
  if (!r.ok) {
    let t = await r.text(), daten = {};
    try { daten = JSON.parse(t); t = daten.detail || daten.fehler || t; } catch (e) {}
    const f = new Error(typeof t === "string" ? t : JSON.stringify(t));
    f.status = r.status; f.daten = daten;
    throw f;
  }
  return r;
}
const holen = async (pfad) => (await api(pfad)).json();
// Sitzungs-Cookie für das, was der Browser ohne Header lädt (Live-Ereignisse, Bilder).
// Gilt nur lesend für /api/events und /api/objekt/, der App-Schlüssel kommt nie in eine Adresse.
let sitzungBereit = null;
function sitzung(neu = false) {
  if (neu || !sitzungBereit) {
    sitzungBereit = api("/api/sitzung", {method: "POST"}).then(() => true);
    sitzungBereit.catch(() => (sitzungBereit = null));
  }
  return sitzungBereit;
}
async function bilderLaden(el) {
  const bilder = [...el.querySelectorAll("img[data-quelle]")];
  if (!bilder.length) return;
  try { await sitzung(); } catch (e) {}
  for (const img of bilder) {
    img.onerror = async () => {
      img.onerror = () => img.remove();
      try { await sitzung(true); img.src = img.dataset.quelle + (img.dataset.quelle.includes("?") ? "&" : "?") + "n=1"; }
      catch (e) { img.remove(); }
    };
    img.src = img.dataset.quelle;
  }
}

let meldTimer;
function melden(text, fehler = false) {
  const m = $("meldung");
  m.textContent = text;
  m.className = "zeigen" + (fehler ? " fehler" : "");
  clearTimeout(meldTimer);
  meldTimer = setTimeout(() => (m.className = ""), fehler ? 4200 : 1800);
}

function anmelden(zeigen) {
  $("anmelden").hidden = !zeigen;
  $("app").hidden = zeigen;
  if (zeigen) setTimeout(() => $("schluessel").focus(), 50);
}
$("anmelde-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  key = $("schluessel").value.trim();
  sitzungBereit = null;
  try { localStorage.setItem("qulsi-key", key); } catch (e) {}
  anmelden(false);
  start();
});

// ---------------------------------------------------------------- Menü
const MENUE = [
  {id: "heute", titel: "Heute", icon: "heute"},
  {id: "chat", titel: "Gespräch", icon: "chat"},
  {id: "gedaechtnis", titel: "Gedächtnis", icon: "gedaechtnis"},
  {id: "agenten", titel: "Agents", icon: "agenten"},
  {id: "einstellungen", titel: "Einstellungen", icon: "einstellungen"},
];
// Kleiner Hinweis, wenn im Gespräch Inhalte von außen standen. Einmal, wegklickbar bis zum nächsten Gespräch.
function chatHinweis() {
  const el = $("chat-hinweis");
  if (!el) return;
  const an = zustand.nachrichten.some((n) => n.belastet) && zustand.hinweisWeg !== zustand.gespraech;
  el.innerHTML = an ? `<div class="hinweis-zeile">${ic("sicherheit")}<span>Hier kamen Inhalte von außen vor. Aktionen fragen deshalb vorher nach.</span><button type="button" aria-label="Ausblenden">×</button></div>` : "";
  el.querySelector("button")?.addEventListener("click", () => { zustand.hinweisWeg = zustand.gespraech; chatHinweis(); });
}
// Offene Freigaben im Gespräch: nur dieser Bereich wird neu gezeichnet, damit Eingabe und Verlauf bleiben.
function chatFreigaben() {
  const el = $("chat-freigaben");
  if (!el || $("blatt")) return;
  const offen = zustand.freigaben.filter((f) => f.status === "offen");
  const schluessel = offen.map((f) => f.id).join() + "|" + JSON.stringify(zustand.pin || {});
  if (el.dataset.stand === schluessel) return;
  el.dataset.stand = schluessel;
  el.innerHTML = offen.length ? `<div class="karte chat-freigabe"><h3 class="warn">${ic("sicherheit")}${offen.length === 1 ? "QuLSI wartet auf deine Freigabe" : offen.length + " Freigaben warten auf dich"}</h3>
    ${freigabenListe(offen)}</div>` : "";
  freigabenVerdrahten(el);
  if (offen.length) window.scrollTo({top: document.body.scrollHeight, behavior: "smooth"});
}
function menueZeichnen(aktiv) {
  const offen = zustand.freigaben.filter((f) => f.status === "offen").length;
  try { offen ? navigator.setAppBadge?.(offen) : navigator.clearAppBadge?.(); } catch (e) {}
  document.title = (offen ? `(${offen}) ` : "") + "QuLSI";
  chatFreigaben();
  const zahl = (id) => ((id === "heute" || id === "chat") && offen ? `<span class="zahl">${offen}</span>` : "");
  $("nav-tabs").innerHTML = MENUE.map((m) => `<a href="#/${m.id}" class="${m.id === aktiv ? "aktiv" : ""}" aria-current="${m.id === aktiv ? "page" : "false"}">
    <span class="punkt">${ic(m.icon)}${zahl(m.id)}</span>${m.titel === "Einstellungen" ? "Mehr" : m.titel}</a>`).join("");
  $("nav-seite").innerHTML = MENUE.map((m) => `<a href="#/${m.id}" class="${m.id === aktiv ? "aktiv" : ""}">${ic(m.icon)}${m.titel}${zahl(m.id)}</a>`).join("");
}
function statusZeigen(offline) {
  zustand.offline = offline;
  for (const id of ["status", "status-seite"]) {
    $(id).className = "status " + (offline ? "offline" : "online");
    $(id).lastChild.textContent = offline ? "Offline, nur lokal" : "Online";
  }
}

// ---------------------------------------------------------------- Router
const ANSICHTEN = {};
function route() {
  const teile = (location.hash.replace(/^#\/?/, "") || "heute").split("/");
  const name = ANSICHTEN[teile[0]] ? teile[0] : "heute";
  menueZeichnen(name);
  const el = $("ansicht");
  el.className = "ansicht";
  void el.offsetWidth;
  ANSICHTEN[name](el, teile.slice(1));
  if (!route.erst) window.scrollTo(0, 0);
  route.erst = false;
}
window.addEventListener("hashchange", route);

// ---------------------------------------------------------------- Heute
function begruessung() {
  const h = new Date().getHours();
  return h < 5 ? "Gute Nacht" : h < 11 ? "Guten Morgen" : h < 18 ? "Hallo" : "Guten Abend";
}
const datumLang = (d = new Date()) => d.toLocaleDateString("de-DE", {weekday: "long", day: "numeric", month: "long"});
function liste(eintraege, zeile, leer) {
  return eintraege && eintraege.length ? `<ul class="liste">${eintraege.map(zeile).join("")}</ul>` : `<div class="leer">${leer}</div>`;
}

ANSICHTEN.heute = (el) => {
  const h = zustand.heute;
  const offen = zustand.freigaben.filter((f) => f.status === "offen");
  const mails = !h ? null : typeof h.mails === "string" ? `<div class="leer">${esc(h.mails)}</div>`

// Was QuLSI tun will, in einem normalen Satz. Technische Felder (art, person, ids …) bleiben weg.
function argumente(f) {
  let a = f.arguments;
  if (typeof a === "string") { try { a = JSON.parse(a); } catch (e) { a = {}; } }
  return a && typeof a === "object" ? a : {};
}
function freigabeSatz(f) {

  const t = f.tool || "";
  if (/memory\.remember|persons\.save|places\.save|projects\.save/.test(t)) return w("text", "inhalt", "name", "titel") ? `QuLSI möchte sich merken: „${w("text", "inhalt", "name", "titel")}“` : "QuLSI möchte sich etwas merken.";
  if (/memory\.forget/.test(t)) return w("text", "frage", "query") ? `QuLSI möchte vergessen: „${w("text", "frage", "query")}“` : "QuLSI möchte etwas aus dem Gedächtnis löschen.";
  if (/mail\.send|email\.send/.test(t)) return `QuLSI möchte eine Mail${w("an", "to", "empfaenger") ? " an " + w("an", "to", "empfaenger") : ""} senden.`;
  if (/mail\.draft|email\.draft/.test(t)) return `QuLSI möchte einen Mail-Entwurf${w("an", "to") ? " an " + w("an", "to") : ""} anlegen.`;
  if (/calendar\.create/.test(t)) return `QuLSI möchte einen Termin anlegen${w("titel", "title", "summary") ? ": „" + w("titel", "title", "summary") + "“" : ""}${w("start", "beginn", "datum") ? " am " + w("start", "beginn", "datum").replace("T", " um ").slice(0, 19) : ""}.`;
  if (/tasks\.create/.test(t)) return `QuLSI möchte eine Aufgabe anlegen${w("titel", "title", "text") ? ": „" + w("titel", "title", "text") + "“" : ""}.`;
  if (t === "door.unlock") return "QuLSI möchte die Tür öffnen.";
  if (t === "home.set_state") return `QuLSI möchte ${w("name", "entity_id", "geraet") || "ein Gerät"} schalten.`;
  if (t === "stimme.probe") return "QuLSI möchte deine neue Stimmprobe als Stimme übernehmen.";
  if (t === "konto.verbinden") return `QuLSI möchte ein Konto verbinden${w("connector") ? ": " + w("connector") : ""}.`;
  return `QuLSI möchte: ${werkzeugName(t)}.`;
}
// Vorschau nur, wenn sie etwas zeigt, das der Satz nicht schon sagt (z. B. Betreff und Text einer Mail).
function vorschauText(f) {
  if (/memory\.|persons\.|places\.|projects\.|tasks\.|calendar\.|door\.|home\.|stimme\.|konto\./.test(f.tool || "")) return "";
  if (typeof f.vorschau === "string" && f.vorschau.trim()) return f.vorschau;
  const a = argumente(f), teile = [];
  const b = a.betreff ?? a.subject, x = a.text ?? a.body ?? a.inhalt;
  if (typeof b === "string") teile.push("Betreff: " + b);
  if (typeof x === "string") teile.push((teile.length ? "\n" : "") + x);
  return teile.join("\n");
}
function restzeit(iso) {
  const s = Math.round((new Date(iso) - Date.now()) / 1000);

}
// Mehrere Karten: der Hinweis auf Inhalte von außen steht nur einmal, an der ersten betroffenen Karte.

async function entscheiden(id, entscheidung, pin, knopf) {
  if (knopf) knopf.disabled = true;

    const r = await (await api("/api/freigaben/" + id, {json: pin ? {entscheidung, pin} : {entscheidung}})).json();

// Offen, solange Bundesland oder PIN fehlen (auch nach einer Wiederherstellung). Nur ein neuer Core liefert bundesland.
function einrichtungOffen() {

async function einrichtungPruefen() {

// ---------------------------------------------------------------- Hochladen (Fotos und Dateien)
// Hochgeladenes gilt als fremder Inhalt (kann von Dritten stammen): QuLSI fragt danach vor Aktionen nach.
// Die Box prüft Größe und Typ selbst noch einmal (MIME und Inhalt), die Prüfung hier spart nur den Weg.
const HOCH_TYPEN = ["image/jpeg", "image/png", "image/webp", "image/heic", "image/heif", "image/gif", "application/pdf", "text/plain", "text/markdown", "text/csv",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  "application/vnd.openxmlformats-officedocument.presentationml.presentation", "application/vnd.oasis.opendocument.text", "application/vnd.oasis.opendocument.spreadsheet"];
const HOCH_ENDUNGEN = /\.(jpe?g|png|webp|heic|heif|gif|pdf|txt|md|csv|docx|xlsx|pptx|odt|ods)$/i;
const HOCH_ACCEPT = "image/*,.pdf,.txt,.md,.csv,.docx,.xlsx,.pptx,.odt,.ods";
const hoch = {grenzen: null, liste: null, aktiv: [], fehlt: false};
const groesse = (b) => b >= 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const istFoto = (f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(f.name || "");
const beruehrung = () => matchMedia("(pointer:coarse)").matches;
function hochPruefen(f) {
  const max = hoch.grenzen?.max_mb || 25;
  if (!f.size) return "Die Datei ist leer.";
  if (f.size > max * 1048576) return `Zu groß (${groesse(f.size)}), höchstens ${max} MB.`;
  if (!(hoch.grenzen?.typen || HOCH_TYPEN).includes(f.type) && !HOCH_ENDUNGEN.test(f.name || "")) return "Diesen Dateityp nimmt QuLSI nicht an.";
  return null;
}
// XHR statt fetch, damit es einen Fortschritt gibt. Der App-Schlüssel geht nur im Header mit.
function hochladen(datei, fortschritt) {
  return new Promise((ok, nein) => {
    const fd = new FormData();
    fd.append("datei", datei, datei.name || "foto.jpg");
    fd.append("ziel", "auto");
    const x = new XMLHttpRequest();
    x.open("POST", "/api/hochladen");
    if (key) x.setRequestHeader("Authorization", "Bearer " + key);
    x.upload.onprogress = (e) => { if (e.lengthComputable) fortschritt?.(e.loaded / e.total); };
    x.onload = () => {
      let d = {};
      try { d = JSON.parse(x.responseText); } catch (e) {}
      if (x.status === 401) { anmelden(true); return nein(new Error("Schlüssel fehlt")); }
      if (x.status === 404 || x.status === 405) { hoch.fehlt = true; return nein(new Error("Hochladen kann die Box noch nicht, kommt mit dem nächsten Update.")); }
      if (x.status >= 400) return nein(new Error(d.fehler || (typeof d.detail === "string" ? d.detail : "") || `Hochladen fehlgeschlagen (${x.status})`));
      ok(d);
    };
    x.onerror = () => nein(new Error("Keine Verbindung zur Box."));
    x.send(fd);
  });
}
async function hochLaden() {
  try {
    const r = await holen("/api/hochladen?limit=10");
    hoch.grenzen = r.grenzen || null; hoch.liste = r.dateien || []; hoch.fehlt = false;
  } catch (e) { hoch.liste = hoch.liste || []; if (e.status === 404 || e.status === 405) hoch.fehlt = true; }
}
// Dateiauswahl. kamera=true öffnet auf dem Handy direkt die Kamera.
function dateienWaehlen(kamera, weiter) {
  const i = document.createElement("input");
  i.type = "file";
  if (kamera) { i.accept = "image/*"; i.setAttribute("capture", "environment"); } else { i.accept = HOCH_ACCEPT; i.multiple = true; }
  i.hidden = true;
  document.body.appendChild(i);
  i.addEventListener("change", () => { const f = [...i.files]; i.remove(); if (f.length) weiter(f); });
  i.click();
}
function anhangMenue(weiter) {
  if (!beruehrung()) { dateienWaehlen(false, weiter); return; }
  const m = document.createElement("div");
  m.id = "anhang-menue";
  m.innerHTML = `<div class="innen"><button type="button" data-kamera="1">${ic("kamera")}Foto aufnehmen</button>
    <button type="button" data-kamera="0">${ic("datei")}Foto oder Datei wählen</button>
    <button type="button" data-weg style="justify-content:center">Abbrechen</button></div>`;
  document.body.appendChild(m);
  m.addEventListener("click", (ev) => {
    const b = ev.target.closest("button");
    if (ev.target === m || b?.hasAttribute("data-weg")) { m.remove(); return; }
    if (b) { m.remove(); dateienWaehlen(b.dataset.kamera === "1", weiter); }
  });
}
// Ein Upload mit Anzeige-Zustand: {name, foto, url, anteil, eintrag, fehler, fertig}
function hochStarten(f, neuZeichnen) {
  const foto = istFoto(f);
  const a = {name: f.name || "Foto", groesse: f.size, foto, url: foto ? URL.createObjectURL(f) : null, anteil: 0, eintrag: null, fehler: hochPruefen(f)};
  if (a.fehler) melden(`${a.name}: ${a.fehler}`, true);
  a.fertig = a.fehler ? Promise.resolve() : hochladen(f, (x) => { a.anteil = x; neuZeichnen(); })
    .then((e) => { a.eintrag = e; a.anteil = 1; hoch.liste = [e, ...(hoch.liste || []).filter((x) => x.id !== e.id)]; })
    .catch((e) => { a.fehler = e.message; melden(`${a.name}: ${e.message}`, true); })
    .finally(neuZeichnen);
  return a;
}
// Ziehen und Ablegen (Desktop) auf ein Element.
function ablegenErlauben(el, weiter) {
  if (!el) return;
  let tiefe = 0;
  const hatDateien = (ev) => [...(ev.dataTransfer?.types || [])].includes("Files");
  el.addEventListener("dragenter", (ev) => { if (!hatDateien(ev)) return; ev.preventDefault(); tiefe++; el.classList.add("ziehen"); });
  el.addEventListener("dragover", (ev) => { if (hatDateien(ev)) ev.preventDefault(); });
  el.addEventListener("dragleave", () => { if (--tiefe <= 0) { tiefe = 0; el.classList.remove("ziehen"); } });
  el.addEventListener("drop", (ev) => {
    if (!hatDateien(ev)) return;
    ev.preventDefault(); tiefe = 0; el.classList.remove("ziehen");
    const f = [...ev.dataTransfer.files];
    if (f.length) weiter(f);
  });
}

// Anhänge im Gespräch (vor dem Senden)
function anhaengeZeichnen() {
  const el = $("anhaenge");
  if (!el) return;
  const liste = zustand.anhaenge || [];
  el.innerHTML = liste.map((a, i) => `<div class="anhang ${a.fehler ? "fehler" : ""}" title="${esc(a.fehler || a.name)}">
    ${a.url ? `<img src="${esc(a.url)}" alt="">` : ic("datei")}<span class="name">${esc(a.fehler || a.name)}</span>
    ${!a.eintrag && !a.fehler ? `<span class="balken"><i style="width:${Math.round(a.anteil * 100)}%"></i></span>` : ""}
    <button type="button" data-anhang-weg="${i}" aria-label="Anhang entfernen">×</button></div>`).join("");
  el.querySelectorAll("[data-anhang-weg]").forEach((b) => b.addEventListener("click", () => {
    const [a] = zustand.anhaenge.splice(Number(b.dataset.anhangWeg), 1);
    if (a?.url && !a.eintrag) URL.revokeObjectURL(a.url);
    anhaengeZeichnen();
  }));
  sendenPruefen();
}
function sendenPruefen() {
  const t = $("text"), s = $("senden");
  if (!t || !s) return;
  const liste = zustand.anhaenge || [];
  const laeuft = liste.some((a) => !a.eintrag && !a.fehler);

}
function anhaengeDazu(dateien) {
  zustand.anhaenge = zustand.anhaenge || [];
  for (const f of dateien.slice(0, 10)) zustand.anhaenge.push(hochStarten(f, anhaengeZeichnen));
  anhaengeZeichnen();
}

// Bereich „Hochladen“ im Gedächtnis
function hochBereich() {
  const statusChip = (e) => e.status === "abgelehnt" ? `<span class="chip warn">Abgelehnt</span>`
    : e.status === "wartet" ? `<span class="chip">Wird eingeordnet</span>` : `<span class="chip gut">Im Gedächtnis</span>`;
  const zeit = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("de-DE", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}); };
  const laufend = hoch.aktiv.filter((a) => !a.eintrag).map((a) => `<div class="zeile">${a.url ? `<img src="${esc(a.url)}" alt="">` : `<span class="sym">${ic("datei")}</span>`}
    <span class="txt"><b>${esc(a.name)}</b><small>${a.fehler ? `<span class="warn">${esc(a.fehler)}</span>` : `Wird hochgeladen … ${Math.round(a.anteil * 100)} %`}</small></span></div>`);
  const fertig = (hoch.liste || []).slice(0, 10).map((e) => `<div class="zeile">${e.art === "foto" && e.vorschau ? `<img data-quelle="${esc(e.vorschau)}" alt="">` : `<span class="sym">${ic(e.art === "foto" ? "kamera" : "datei")}</span>`}
    <span class="txt"><b>${esc(e.name)}</b><small>${[e.groesse ? groesse(e.groesse) : "", zeit(e.zeit), e.hinweis ? esc(e.hinweis) : ""].filter(Boolean).join(" · ")}</small></span>${statusChip(e)}</div>`);
  return `<h2 class="abschnitt">Hochladen</h2>
    <div class="ablage" id="ablage">
      <div>${beruehrung() ? "Fotos und Dokumente fürs Gedächtnis" : "Fotos und Dokumente hierher ziehen oder auswählen"}</div>
      <div class="reihe">${beruehrung() ? `<button class="knopf" type="button" id="hoch-kamera">${ic("kamera")}Foto aufnehmen</button>` : ""}
        <button class="knopf hell" type="button" id="hoch-waehlen">${ic("klammer")}${beruehrung() ? "Auswählen" : "Dateien wählen"}</button></div>
      <div class="klein" style="color:var(--zweit)">Bis ${hoch.grenzen?.max_mb || 25} MB: Fotos, PDF, Text, Word, Excel. QuLSI behandelt Inhalte aus Dateien wie Inhalte von außen und fragt danach vor Aktionen nach.</div>
    </div>
    ${hoch.fehlt ? `<p class="hinweis">Hochladen kann die Box noch nicht, kommt mit dem nächsten Update.</p>` : ""}
    ${laufend.length || fertig.length ? `<div class="gruppe hoch-liste">${[...laufend, ...fertig].join("")}</div>` : ""}`;
}
function hochNeu() {
  const b = $("hoch-bereich");
  if (!b) return;
  b.innerHTML = hochBereich();
  const weiter = (dateien) => { for (const f of dateien.slice(0, 20)) hoch.aktiv.unshift(hochStarten(f, hochNeu)); hochNeu(); };
  $("hoch-kamera")?.addEventListener("click", () => dateienWaehlen(true, weiter));
  $("hoch-waehlen").addEventListener("click", () => dateienWaehlen(false, weiter));
  ablegenErlauben($("ablage"), weiter);
  bilderLaden(b);
}

// ---------------------------------------------------------------- Gespräch
const VORSCHLAEGE = ["Was steht heute an?", "Wo sind meine Schlüssel?", "Fasse meine neuen Mails zusammen", "Erinnere mich morgen um 9 an den Müll"];
ANSICHTEN.chat = (el) => {

  const t = $("text");

// Sicheres Markdown für Antworten: erst alles escapen, dann nur fett, kursiv, Code, Listen,
// Überschriften und http(s)-Links erzeugen. Rohes HTML aus der Antwort erscheint nie als HTML.
function mdInline(t) {
  const codes = [];
  t = esc(t).replace(/`([^`\n]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, txt, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${txt}</a>`)
    .replace(/\*\*([^*\n]+)\*\*|__([^_\n]+)__/g, (_, a, b) => `<strong>${a ?? b}</strong>`)
    .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/(^|[^_\w])_([^_\s][^_\n]*?)_(?!\w)/g, "$1<em>$2</em>");
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function markdown(text) {
  const zeilen = String(text ?? "").replace(/\r/g, "").split("\n");
  const out = [];
  let liste = null, absatz = [];
  const absatzEnde = () => { if (absatz.length) { out.push(`<p>${absatz.map(mdInline).join("<br>")}</p>`); absatz = []; } };
  const punkt = (x) => `<li>${mdInline(x.text)}${x.kinder.length ? `<ul>${x.kinder.map((k) => `<li>${mdInline(k)}</li>`).join("")}</ul>` : ""}</li>`;
  const listeEnde = () => { if (liste) { out.push(`<${liste.typ}>${liste.punkte.map(punkt).join("")}</${liste.typ}>`); liste = null; } };
  for (let i = 0; i < zeilen.length; i++) {
    const z = zeilen[i];
    if (/^\s*```/.test(z)) {
      absatzEnde(); listeEnde();
      const code = [];
      while (++i < zeilen.length && !/^\s*```/.test(zeilen[i])) code.push(zeilen[i]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
      continue;
    }
    let m;
    if ((m = z.match(/^\s*#{1,6}\s+(.*)$/))) { absatzEnde(); listeEnde(); out.push(`<h4>${mdInline(m[1])}</h4>`); continue; }
    if ((m = z.match(/^\s*[-*+•]\s+(.*)$/)) || (m = z.match(/^\s*\d+[.)]\s+(.*)$/))) {
      const typ = /^\s*\d/.test(z) ? "ol" : "ul";
      absatzEnde();
      if (liste && /^\s{2,}/.test(z)) { liste.punkte[liste.punkte.length - 1].kinder.push(m[1]); continue; }  // Unterpunkt
      if (liste && liste.typ !== typ) listeEnde();
      (liste ||= {typ, punkte: []}).punkte.push({text: m[1], kinder: []});
      continue;
    }
    if (!z.trim()) { absatzEnde(); listeEnde(); continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(z)) { absatzEnde(); listeEnde(); continue; }
    listeEnde();
    absatz.push(z.trim());
  }
  absatzEnde(); listeEnde();
  return out.join("");
}
// Für die Sprachausgabe: Markdown-Zeichen weg, Text bleibt.
function ohneMarkdown(text) {
  return String(text ?? "").replace(/```[\s\S]*?```/g, " ").replace(/`([^`]+)`/g, "$1")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/^\s*#{1,6}\s+/gm, "").replace(/^\s*[-*+•]\s+/gm, "")
    .replace(/\*\*(.+?)\*\*/g, "$1").replace(/(^|\W)__(.+?)__(?=\W|$)/g, "$1$2").replace(/\*(\S.*?)\*/g, "$1")
    .replace(/(^|\W)_(\S.*?)_(?=\W|$)/g, "$1$2").replace(/\*+/g, "").replace(/\n{2,}/g, ".\n").replace(/([.!?:])\.\n/g, "$1\n");
}
// Erkannte Anweisungen in fremden Inhalten (Mail, Web, Datei): rot und in Klartext über der Antwort.
function warnungenHtml(w) {
  const liste = [...new Set((Array.isArray(w) ? w : w ? [w] : []).filter((x) => typeof x === "string" && x.trim()))];
  return liste.map((t) => `<div class="warnung-rot" role="alert">${ic("sicherheit")}<span>${esc(t)}</span></div>`).join("");
}
function blaseElement(n) {
  const d = document.createElement("div");
  d.className = "msg " + n.rolle + (n.wartet ? " tippt" : "");
  if (n.wartet) d.innerHTML = "<span></span><span></span><span></span>";
  else if (n.rolle === "qulsi") d.innerHTML = warnungenHtml(n.warnungen) + markdown(n.text);
  else {
    if (n.anhaenge?.length) {
      const fotos = n.anhaenge.filter((a) => a.url), andere = n.anhaenge.filter((a) => !a.url);
      d.innerHTML = (fotos.length ? `<div class="bilder">${fotos.map((a) => `<img src="${esc(a.url)}" alt="${esc(a.name)}">`).join("")}</div>` : "")
        + andere.map((a) => `<span class="dateichip">${ic("datei")}${esc(a.name)}</span>`).join("") + (andere.length ? "<br>" : "");
    }
    d.append(document.createTextNode(n.text));
  }
  if (n.meta && !n.wartet) {
    const m = document.createElement("details"); m.className = "meta";
    m.innerHTML = `<summary aria-label="Details zur Antwort">Details</summary>`;
    m.append(n.meta); d.appendChild(m);
  }
  return d;
}
function blase(n) {
  const v = $("verlauf");
  if (!v) return;
  document.querySelectorAll(".leerchat,.vorschlaege").forEach((x) => x.remove());
  $("neu")?.removeAttribute("hidden");
  n.el = blaseElement(n);
  v.appendChild(n.el);
  window.scrollTo({top: document.body.scrollHeight, behavior: "smooth"});

async function alsWav(blob) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  const quelle = await new Promise((ok, nein) => { const p = ctx.decodeAudioData(daten, ok, nein); if (p?.then) p.then(ok, nein); });

  const q = off.createBufferSource();
  q.buffer = quelle; q.connect(off.destination); q.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const str = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); str(8, "WAVE"); str(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 0x7fff, true);
  return {blob: new Blob([buf], {type: "audio/wav"}), sekunden: quelle.duration};

    zustand.heute = h; zustand.freigaben = f; zustand.timeline = Array.isArray(t) ? t : []; zustand.pin = p;
    statusZeigen(h.offline);
  } catch (e) { console.warn(e); return; }
  if (aktuelleAnsicht() === "heute" && !$("blatt")) route(); else menueZeichnen(aktuelleAnsicht());
}
async function umgebungLaden() {
  try { zustand.umgebung = await holen("/api/umgebung"); } catch (e) {}
  if (aktuelleAnsicht() === "einstellungen") route();
}
async function gedaechtnisLaden() {
  try { zustand.gedaechtnis = await holen("/api/gedaechtnis/status"); } catch (e) {}
  if (aktuelleAnsicht() === "gedaechtnis") route();
}

// ---------------------------------------------------------------- Web Push (Mitteilungen aufs Handy und die Uhr)
// Der Service Worker (/sw.js) zeigt nur an, was die Box schickt. Auf dem iPhone geht das erst, wenn
// QuLSI vom Home-Bildschirm geöffnet wird (iOS 16.4+), und Erlauben braucht einen Fingertipp.
const push = {stand: null, eigenId: null, pinFuer: null, laeuft: false};
const pushMoeglich = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const istIos = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const alsApp = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function geraetName() {
  const ua = navigator.userAgent;
  const g = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) || (istIos() && !/iPhone/.test(ua)) ? "iPad" : /Android/.test(ua) ? "Android"
    : /Mac OS X/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : /Linux/.test(ua) ? "Linux" : "Gerät";
  const b = /Edg\//.test(ua) ? "Edge" : /Firefox\//.test(ua) ? "Firefox" : /Chrome\//.test(ua) && !/Android/.test(ua) ? "Chrome" : "";
  return b && !alsApp() ? `${g} (${b})` : g;
}
const b64uZuBytes = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - s.length % 4) % 4)), (c) => c.charCodeAt(0));
async function aboId(endpoint) {
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(endpoint)));
  return Array.from(h.slice(0, 8), (x) => x.toString(16).padStart(2, "0")).join("");
}
async function pushLaden() {
  try { push.stand = await holen("/api/push"); } catch (e) { push.stand = {fehler: e.message, geraete: []}; }
  if (location.hash.includes("benachrichtigungen")) route();
}
// Beim Start: ist die Erlaubnis schon da, das Abo der Box (wieder) melden. Abos ändern sich manchmal.
async function pushAbgleichen() {
  if (!key || !pushMoeglich() || !window.isSecureContext) return pushLaden();
  try {
    const reg = await navigator.serviceWorker.register("/sw.js");
    const abo = Notification.permission === "granted" ? await reg.pushManager.getSubscription() : null;
    if (abo) {
      push.eigenId = await aboId(abo.endpoint);
      await api("/api/push/abo", {json: {abo: abo.toJSON(), geraet: geraetName()}});
    }
  } catch (e) {}
  pushLaden();
}
async function pushErlauben(knopf) {
  knopf.disabled = true;
  try {
    // requestPermission muss direkt aus dem Fingertipp kommen (iPhone), deshalb als Erstes.
    const erlaubt = await Notification.requestPermission();
    if (erlaubt !== "granted") throw new Error(erlaubt === "denied" ? "Mitteilungen sind für QuLSI aus. Einschalten in den Einstellungen des Handys." : "Nicht erlaubt");
    const reg = await navigator.serviceWorker.register("/sw.js");
    await navigator.serviceWorker.ready;
    const stand = push.stand?.schluessel ? push.stand : await holen("/api/push");
    let abo = await reg.pushManager.getSubscription();
    if (abo && abo.options?.applicationServerKey && btoa(String.fromCharCode(...new Uint8Array(abo.options.applicationServerKey))) !==
        btoa(String.fromCharCode(...b64uZuBytes(stand.schluessel)))) { await abo.unsubscribe(); abo = null; }
    abo = abo || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64uZuBytes(stand.schluessel)});
    push.eigenId = await aboId(abo.endpoint);
    await api("/api/push/abo", {json: {abo: abo.toJSON(), geraet: geraetName()}});
    await api("/api/push/test", {json: {id: push.eigenId}});
    melden("Erlaubt. Eine Testnachricht ist unterwegs");
  } catch (e) { melden(e.message, true); }
  knopf.disabled = false;
  pushLaden();
}
async function pushAbmelden(id) {
  try {
    if (id === push.eigenId) {
      const abo = await (await navigator.serviceWorker.getRegistration())?.pushManager.getSubscription();
      if (abo) await abo.unsubscribe();
      push.eigenId = null;
    }
    await api("/api/push/abo/" + id, {method: "DELETE"});
    melden("Entfernt");
  } catch (e) { melden(e.message, true); }
  pushLaden();
}
async function pushDetails(id, an, pin = "") {
  try {
    await api(`/api/push/abo/${id}/details`, {json: {an, pin}});
    push.pinFuer = null;
    melden(an ? "Inhalte werden angezeigt" : "Nur noch Titel");
  } catch (e) { melden(e.message, true); }
  pushLaden();
}
function pushBereich() {
  const s = push.stand;
  const geraete = s?.geraete || [];
  const eigen = geraete.find((g) => g.id === push.eigenId);
  let oben;
  if (!pushMoeglich() && istIos() && !alsApp()) {
    oben = zeile("Dieses iPhone", "Mitteilungen gehen erst, wenn QuLSI auf dem Home-Bildschirm liegt: in Safari Teilen › Zum Home-Bildschirm, dann QuLSI dort öffnen.", `<span class="chip">Schritt fehlt</span>`);
  } else if (!pushMoeglich()) {
    oben = zeile("Dieses Gerät", "Dieser Browser kann keine Mitteilungen empfangen.", `<span class="chip">Nicht möglich</span>`);
  } else if (!window.isSecureContext) {
    oben = zeile("Dieses Gerät", "Mitteilungen brauchen eine https-Adresse für QuLSI. Auf RunPod ist das schon so, auf der Box über Tailscale (siehe Anleitung).", `<span class="chip warn">https fehlt</span>`);
  } else if (Notification.permission === "denied") {
    oben = zeile("Dieses Gerät", "Mitteilungen für QuLSI sind ausgeschaltet. Einschalten in den Einstellungen des Handys unter Mitteilungen › QuLSI.", `<span class="chip warn">Aus</span>`);
  } else if (eigen) {
    oben = zeile("Dieses Gerät", "Bekommt Hinweise und Freigaben, auch auf der gekoppelten Uhr.", `<button class="knopf klein" data-push-test="${esc(eigen.id)}">Test</button>`);
  } else {
    oben = `<div class="zeile" style="flex-direction:column;align-items:stretch;gap:12px"><span class="txt"><b>Dieses Gerät</b>
      <small>Termine, Hinweise und offene Freigaben als Mitteilung. Eine gekoppelte Apple Watch oder Wear-OS-Uhr zeigt sie von selbst.</small></span>
      <button class="knopf hell" id="push-erlauben">Benachrichtigungen erlauben</button></div>`;
  }
  const liste = geraete.map((g) => {
    const name = esc(g.geraet || g.dienst || "Gerät") + (g.id === push.eigenId ? " · dieses Gerät" : "");
    const zuletzt = g.zuletzt_ok ? "Zuletzt zugestellt " + new Date(g.zuletzt_ok).toLocaleString("de-DE", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}) : "Noch nichts zugestellt";
    const pinForm = push.pinFuer === g.id ? `<form class="reihe" data-push-pin="${esc(g.id)}" style="margin-top:8px;flex-wrap:nowrap">
        <input class="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" aria-label="Freigabe-PIN" placeholder="Freigabe-PIN" style="flex:1">
        <button class="knopf klein">Einschalten</button></form>` : "";
    return zeile(name, `${zuletzt}${g.fehler ? ` · <span class="warn">${esc(g.fehler)} Fehler</span>` : ""}<br>Inhalte auf dem Sperrbildschirm: ${g.details ? "an" : "aus, nur der Titel"}`,
      `<span class="reihe" style="gap:6px;flex-wrap:nowrap">
        <label class="schalter" title="Inhalte auf dem Sperrbildschirm"><input type="checkbox" data-push-details="${esc(g.id)}" ${g.details ? "checked" : ""} aria-label="Inhalte auf dem Sperrbildschirm"><span></span></label>
        <button class="knopf klein" data-push-weg="${esc(g.id)}" aria-label="Gerät entfernen">Entfernen</button></span>`, pinForm);
  }).join("");
  return `<div class="gruppe">${oben}</div>
    ${geraete.length ? `<h2 class="abschnitt">Geräte mit Mitteilungen</h2><div class="gruppe">${liste}</div>
      <p class="hinweis">Ohne „Inhalte“ zeigt der Sperrbildschirm nur z. B. „Gleich ein Termin“. Inhalte einschalten geht nur mit der Freigabe-PIN. Freigeben selbst geht immer nur hier in der App.</p>` : ""}`;
}
function pushVerdrahten() {
  $("push-erlauben")?.addEventListener("click", (ev) => pushErlauben(ev.currentTarget));
  document.querySelectorAll("[data-push-test]").forEach((k) => k.addEventListener("click", async () => {
    try { const r = await (await api("/api/push/test", {json: {id: k.dataset.pushTest}})).json(); melden(r.gesendet ? "Gesendet" : "Nicht zugestellt", !r.gesendet); }
    catch (e) { melden(e.message, true); }
  }));
  document.querySelectorAll("[data-push-weg]").forEach((k) => k.addEventListener("click", () => pushAbmelden(k.dataset.pushWeg)));
  document.querySelectorAll("[data-push-details]").forEach((x) => x.addEventListener("change", () => {
    if (x.checked) { push.pinFuer = x.dataset.pushDetails; route(); } else pushDetails(x.dataset.pushDetails, false);
  }));
  document.querySelectorAll("[data-push-pin]").forEach((f) => f.addEventListener("submit", (ev) => {
    ev.preventDefault();
    pushDetails(f.dataset.pushPin, true, f.querySelector("input").value);
  }));
}

// Warnung aus dem Event Bus: bleibt oben stehen, bis man sie wegklickt.
function warnungMelden(text) {
  if ([...document.querySelectorAll("#warnungen-live span")].some((x) => x.textContent === text)) return;
  let box = $("warnungen-live");
  if (!box) { box = document.createElement("div"); box.id = "warnungen-live"; document.body.appendChild(box); }
  const el = document.createElement("div");
  el.className = "warnung-rot schwebend";
  el.setAttribute("role", "alert");
  el.innerHTML = `${ic("sicherheit")}<span></span><button type="button" aria-label="Schließen">×</button>`;
  el.querySelector("span").textContent = text;
  el.querySelector("button").onclick = () => el.remove();
  box.appendChild(el);
}
// Event Bus live: neue Ereignisse erscheinen sofort.
let quelle;
// EventSource kann keine Header schicken: es nutzt das Sitzungs-Cookie. Bricht die Verbindung ab
// (z. B. 401 nach einem Neustart der Box), holt live() erst eine neue Sitzung und verbindet neu.
async function live(neu = false) {
  if (quelle) quelle.close();
  if (!key) return;
  try { await sitzung(neu); }
  catch (e) { if (e.status !== 401) setTimeout(() => live(true), 30000); return; }
  quelle = new EventSource("/api/events");
  quelle.onmessage = (ev) => {
    let d = null;
    try { d = JSON.parse(ev.data); } catch (e) {}
    if (d?.art === "warnung" && d.text) warnungMelden(d.text);
    aktualisieren();
    if (location.hash.includes("stimme")) probeLaden();
  };
  quelle.onerror = () => { quelle.close(); setTimeout(() => live(true), 10000); };
}

const BUNDESLAENDER = {BW: "Baden-Württemberg", BY: "Bayern", BE: "Berlin", BB: "Brandenburg", HB: "Bremen", HH: "Hamburg", HE: "Hessen",
  MV: "Mecklenburg-Vorpommern", NI: "Niedersachsen", NW: "Nordrhein-Westfalen", RP: "Rheinland-Pfalz", SL: "Saarland", SN: "Sachsen",
  ST: "Sachsen-Anhalt", SH: "Schleswig-Holstein", TH: "Thüringen"};
async function nutzerLaden() {
  try { zustand.nutzer = await holen("/api/nutzer"); } catch (e) { zustand.nutzer = zustand.nutzer || {name: null}; }
  const a = aktuelleAnsicht();
  if (a === "heute" || (a === "einstellungen" && location.hash.includes("system"))) route();
  einrichtungPruefen();
}
function start() {
  route.erst = true;
  route();
  aktualisieren();
  connectorenLaden();
  agentenLaden();
  einstLaden();
  gedaechtnisLaden();
  umgebungLaden();
  nutzerLaden();
  probeLaden();
  pushAbgleichen();
  live();
}
anmelden(false);
start();
setInterval(aktualisieren, 60000);
</script>
